<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Debt Tracker</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1c2420;--mut:#6a746f;--line:#e3e1d9;--ac:#1d6a4d;--acs:#d9eee4;--bad:#b23a30;--bads:#f8dfdc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111513;--card:#1b211e;--ink:#e9eeea;--mut:#98a39d;--line:#2b332f;--ac:#5fc49a;--acs:#1f3a2f;--bad:#ef7b70;--bads:#3d2220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111513;--card:#1b211e;--ink:#e9eeea;--mut:#98a39d;--line:#2b332f;--ac:#5fc49a;--acs:#1f3a2f;--bad:#ef7b70;--bads:#3d2220;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 14px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .3s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stats div{background:var(--bg);border-radius:12px;padding:10px}
.stats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
.gh h2{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nm{font-weight:600}
.bal{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 0;font:inherit;font-size:12px;cursor:pointer;line-height:1.2}
.chip small{display:block;font-size:10px;color:var(--mut)}
.chip.paid{background:var(--acs);border-color:var(--ac);color:var(--ac);font-weight:600}
.chip.paid small{color:var(--ac)}
.chip.late{background:var(--bads);border-color:var(--bad);color:var(--bad)}
.chip.now{box-shadow:0 0 0 2px var(--ac)}
.chip.off{opacity:.4}
.link{background:none;border:0;color:var(--ac);font:inherit;font-size:13px;cursor:pointer;padding:0}
.add{width:100%;padding:13px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;color:var(--ac);font:inherit;font-weight:600;cursor:pointer}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--acs);color:var(--ac);margin-left:6px;vertical-align:middle}
.tag.late{background:var(--bads);color:var(--bad)}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,400px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.btns .pri{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
.btns .del{color:var(--bad);flex:0 0 auto}
</style></head>
<body><main>
<h1>Debt Tracker</h1>
<div id="sum"></div><div id="list"></div>
<button class="add" id="addBtn">+ Add loan</button>
<p class="mut" style="text-align:center;margin-top:18px">Data is saved in this browser only. <button class="link" id="reset">Reset to original</button></p>
</main>
<dialog id="dlg"><form method="dialog" id="f">
<b id="dt">Loan</b>
<label>Name</label><input id="fn" required>
<label>Group (e.g. Gloan, Sloan)</label><input id="fg" required>
<label>Loan amount (₱)</label><input id="fp" type="number" step="0.01" min="0" required>
<label>Monthly due (₱)</label><input id="fm" type="number" step="0.01" min="0" required>
<label>Date due (e.g. 23 (15))</label><input id="fd">
<div class="btns"><button type="button" class="del" id="fdel">Delete</button><button type="button" id="fc">Cancel</button><button class="pri" id="fs">Save</button></div>
</form></dialog>
<script>
var KEY="debt-tracker-v1",MN=["Sep","Oct","Nov","Dec","Jan","Feb","Mar","Apr","May","Jun"],MY=[[2026,8],[2026,9],[2026,10],[2026,11],[2027,0],[2027,1],[2027,2],[2027,3],[2027,4],[2027,5]];
function mk(i,g,n,p,m,d,paid){var a=[];for(var k=0;k<10;k++)a.push(k<paid);return{id:i,group:g,name:n,principal:p,monthly:m,due:d,paid:a}}
function seed(){var s=mk(1,"Gloan","Gloan 1",19846.68,4961.67,"23 (15)",1);var b=mk(2,"Gloan","Gloan 2",22327.47,2480.83,"6 (30)",2);var c=mk(3,"Sloan","Sloan 1",19307.05,2758.15,"22 (30)",1);var d=mk(4,"Sloan","Sloan 2",6661.45,1332.29,"10 (15)",2);return[s,b,c,d]}
var S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!Array.isArray(S))S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var fmt=new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP",minimumFractionDigits:2});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cnt(l){return l.paid.filter(Boolean).length}
function bal(l){return Math.max(0,Math.round((l.principal-l.monthly*cnt(l))*100)/100)}
function byDec(l){var n=4+l.paid.slice(4).filter(Boolean).length;return Math.max(0,l.principal-l.monthly*n)}
function left(l){return l.monthly>0?Math.ceil(bal(l)/l.monthly-1e-9):0}
function dueDate(l,i){var d=parseInt(l.due,10)||1,y=MY[i][0],m=MY[i][1],mx=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d,mx))}
var now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
var cur=MY.findIndex(function(x){return x[0]==now.getFullYear()&&x[1]==now.getMonth()});
function render(){
 var tot=0,orig=0,dec=0,due=0,late=0;
 S.forEach(function(l){var b=bal(l);tot+=b;orig+=l.principal;dec+=byDec(l);
  if(b>0){if(cur>=0&&!l.paid[cur])due+=Math.min(l.monthly,b);
   l.paid.forEach(function(p,i){if(!p&&dueDate(l,i)<today)late++})}});
 var pct=orig?Math.round((1-tot/orig)*100):0;
 $("sum").innerHTML='<div class="card"><div class="mut">Total balance</div><div class="big">'+fmt.format(tot)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="mut">'+pct+'% repaid of '+fmt.format(orig)+'</div><div class="stats"><div><span class="mut">'+(cur>=0?"Still due in "+MN[cur]:"Due this month")+'</span><b>'+fmt.format(due)+'</b></div><div><span class="mut">Balance by Dec 2026</span><b>'+fmt.format(dec)+'</b></div></div>'+(late?'<p class="mut" style="color:var(--bad);margin:10px 0 0">'+late+' overdue payment'+(late>1?'s':'')+'</p>':'')+'</div>';
 var gs=[];S.forEach(function(l){if(gs.indexOf(l.group)<0)gs.push(l.group)});
 $("list").innerHTML=gs.map(function(g){
  var ls=S.filter(function(l){return l.group===g}),sub=ls.reduce(function(a,l){return a+bal(l)},0);
  return '<div class="gh"><h2>'+esc(g)+'</h2><span class="mut">'+fmt.format(sub)+'</span></div>'+ls.map(card).join('')}).join('')
}
function card(l){
 var b=bal(l),done=b<=0,pc=l.principal?Math.round((1-b/l.principal)*100):0;
 var chips=l.paid.map(function(p,i){
  var c="chip";if(p)c+=" paid";else if(done)c+=" off";else if(dueDate(l,i)<today)c+=" late";if(i===cur)c+=" now";
  return '<button class="'+c+'" data-t="'+l.id+'" data-m="'+i+'">'+MN[i]+'<small>'+(p?"✓ paid":done?"—":dueDate(l,i).getDate()+"th")+'</small></button>'}).join('');
 return '<div class="card"><div class="row"><div><div class="nm">'+esc(l.name)+(done?'<span class="tag">Paid off</span>':'')+'</div><div class="mut">'+fmt.format(l.monthly)+'/mo · due '+esc(l.due||"—")+'</div></div><div><div class="bal">'+fmt.format(b)+'</div><div class="mut" style="text-align:right">'+(done?'cleared':left(l)+' payment'+(left(l)==1?'':'s')+' left')+'</div></div></div><div class="bar"><i style="width:'+pc+'%"></i></div><div class="row"><span class="mut">'+pc+'% of '+fmt.format(l.principal)+'</span><button class="link" data-e="'+l.id+'">Edit</button></div><div class="chips">'+chips+'</div></div>'
}
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-t]");
 if(t){var l=S.find(function(x){return x.id==t.dataset.t});l.paid[t.dataset.m]=!l.paid[t.dataset.m];save();render();return}
 var ed=e.target.closest("[data-e]");if(ed)openF(S.find(function(x){return x.id==ed.dataset.e}))
});
var cu=null;
function openF(l){cu=l;$("dt").textContent=l?"Edit loan":"New loan";$("fn").value=l?l.name:"";$("fg").value=l?l.group:(S.length?S[S.length-1].group:"");$("fp").value=l?l.principal:"";$("fm").value=l?l.monthly:"";$("fd").value=l?l.due:"";$("fdel").style.display=l?"":"none";$("dlg").showModal()}
$("addBtn").onclick=function(){openF(null)};
$("fc").onclick=function(){$("dlg").close()};
$("fdel").onclick=function(){if(cu&&confirm("Delete this loan?")){S=S.filter(function(x){return x!==cu});save();render();$("dlg").close()}};
$("f").onsubmit=function(e){
 var v={name:$("fn").value.trim(),group:$("fg").value.trim(),principal:+$("fp").value,monthly:+$("fm").value,due:$("fd").value.trim()};
 if(!v.name||!v.group||!(v.principal>=0)||!(v.monthly>=0))return;
 if(cu)Object.assign(cu,v);else{v.id=Date.now();v.paid=MN.map(function(){return false});S.push(v)}
 save();render()};
$("reset").onclick=function(){if(confirm("Reset all loans to the original spreadsheet values?")){S=seed();save();render()}};
render();
</script></body></html>
